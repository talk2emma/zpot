components:
  schemas:
    AddReminderRequest:
      type: object
      properties:
        minutes_before:
          type: integer
          maximum: 240
          minimum: 1
      required:
      - minutes_before
    AppealRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - message
    AreaEvidenceResponse:
      type: object
      properties:
        area_id:
          type: integer
        evidence_status:
          type: string
        verification_status:
          type: string
        verified_at:
          type: string
          format: date-time
          nullable: true
        evidence:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - area_id
      - evidence
      - evidence_status
      - verification_status
      - verified_at
    AreaRulesResponse:
      type: object
      properties:
        area_id:
          type: integer
        verification_status:
          type: string
        rules:
          type: array
          items:
            type: object
            additionalProperties: {}
        restrictions:
          type: array
          items:
            type: object
            additionalProperties: {}
        closures:
          type: array
          items:
            type: object
            additionalProperties: {}
        rule_lines:
          type: array
          items:
            type: string
      required:
      - area_id
      - closures
      - restrictions
      - rule_lines
      - rules
      - verification_status
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        area:
          type: object
          additionalProperties: {}
          readOnly: true
        reason:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/AssignmentStatusEnum'
        due_at:
          type: string
          format: date-time
          nullable: true
        current_rules:
          type: array
          items:
            type: string
          readOnly: true
        last_submission:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - created_at
      - current_rules
      - id
      - last_submission
      - reason
    AssignmentStatusEnum:
      enum:
      - assigned
      - submitted
      - approved
      - rejected
      type: string
      description: |-
        * `assigned` - Assigned
        * `submitted` - Submitted — pending review
        * `approved` - Approved
        * `rejected` - Rejected
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content_type:
          type: string
          maxLength: 40
        size:
          type: integer
          maximum: 2147483647
          minimum: 0
        width:
          type: integer
          maximum: 2147483647
          minimum: 0
        height:
          type: integer
          maximum: 2147483647
          minimum: 0
        metadata_stripped:
          type: boolean
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - height
      - id
      - size
      - uploaded_at
      - width
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - tokens
      - user
    AvailabilityStatusEnum:
      enum:
      - unknown
      - recently_reported_available
      - reported_occupied
      - conflicting_reports
      type: string
      description: |-
        * `unknown` - unknown
        * `recently_reported_available` - recently_reported_available
        * `reported_occupied` - reported_occupied
        * `conflicting_reports` - conflicting_reports
    BlankEnum:
      enum:
      - ''
    CategoryCa3Enum:
      enum:
      - free
      - free_time_limited
      - paid
      - unknown
      - restricted
      type: string
      description: |-
        * `free` - free
        * `free_time_limited` - free_time_limited
        * `paid` - paid
        * `unknown` - unknown
        * `restricted` - restricted
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        country_code:
          type: string
          maxLength: 2
        timezone:
          type: string
          maxLength: 64
        currency:
          type: string
          maxLength: 3
        is_supported:
          type: boolean
          description: Parking guidance available in this city.
        launch_note:
          type: string
          maxLength: 240
        center:
          type: object
          additionalProperties: {}
          readOnly: true
        bbox:
          type: array
          items:
            type: number
            format: double
          nullable: true
          readOnly: true
      required:
      - bbox
      - center
      - country_code
      - id
      - name
      - slug
    CompareResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ParkingOptionDoc'
        best_id:
          type: integer
          nullable: true
      required:
      - best_id
      - results
    ConfidenceLabelEnum:
      enum:
      - high
      - medium
      - low
      type: string
      description: |-
        * `high` - high
        * `medium` - medium
        * `low` - low
    Consents:
      type: object
      properties:
        terms:
          type: object
          additionalProperties: {}
        privacy:
          type: object
          additionalProperties: {}
        analytics:
          type: object
          additionalProperties: {}
        personalised_ads:
          type: object
          additionalProperties: {}
        marketing:
          type: object
          additionalProperties: {}
      required:
      - analytics
      - marketing
      - personalised_ads
      - privacy
      - terms
    Contributions:
      type: object
      properties:
        karma:
          type: number
          format: double
        reports:
          type: integer
        accepted:
          type: integer
        published:
          type: integer
        verifications:
          type: integer
        level:
          type: string
        recent_events:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - accepted
      - karma
      - level
      - published
      - recent_events
      - reports
      - verifications
    CoverageDoc:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CoverageDocStatusEnum'
        city:
          type: string
          nullable: true
        area:
          type: object
          additionalProperties: {}
          nullable: true
        note:
          type: string
      required:
      - area
      - city
      - note
      - status
    CoverageDocStatusEnum:
      enum:
      - full
      - partial
      - mapping
      - outside_mapped_areas
      - unsupported
      type: string
      description: |-
        * `full` - full
        * `partial` - partial
        * `mapping` - mapping
        * `outside_mapped_areas` - outside_mapped_areas
        * `unsupported` - unsupported
    CoverageEnum:
      enum:
      - full
      - partial
      - mapping
      type: string
      description: |-
        * `full` - Verified coverage
        * `partial` - Partial coverage
        * `mapping` - Being mapped
    CreateEventRequest:
