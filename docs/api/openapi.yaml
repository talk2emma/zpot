openapi: 3.0.3
info:
  title: Zpot API
  version: 1.0.0-part1
  description: Parking discovery and mobility intelligence for Lisbon. Free-first,
    evidence-based parking guidance. Development data is sample data, not live regulations.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetStatus'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmStatus'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: 'Authenticated: resend to the signed-in user''s address.'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationStatus'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/availability/nearby/:
    get:
      operationId: availability_nearby_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      - in: query
        name: radius_meters
        schema:
          type: integer
          maximum: 2000
          minimum: 50
          default: 800
      tags:
      - availability
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedObservationList'
          description: ''
  /api/v1/availability/observations/:
    get:
      operationId: availability_observations_list
      tags:
      - availability
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Observation'
          description: ''
    post:
      operationId: availability_observations_create
      tags:
      - availability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObservationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateObservationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateObservationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
          description: ''
  /api/v1/cities/:
    get:
      operationId: cities_list
      tags:
      - cities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/v1/cities/{id}/:
    get:
      operationId: cities_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: ''
  /api/v1/cities/{id}/coverage/:
    get:
      operationId: cities_coverage_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportedArea'
          description: ''
  /api/v1/community/me/:
    get:
      operationId: community_me_retrieve
      description: Contributor recognition. Reputation never overrides verified legal
        restrictions.
      tags:
      - community
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contributions'
          description: ''
  /api/v1/config/:
    get:
      operationId: config_retrieve
      description: Public, non-secret client configuration.
      tags:
      - config
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
          description: ''
  /api/v1/detection/config/:
    get:
      operationId: detection_config_retrieve
      tags:
      - detection
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionConfig'
          description: ''
  /api/v1/devices/:
    get:
      operationId: devices_retrieve
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
    post:
      operationId: devices_create
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/{id}/:
    delete:
      operationId: devices_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/events/park/:
    post:
      operationId: events_park_create
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkEvent'
          description: ''
  /api/v1/events/park/{id}/confirm/:
    post:
      operationId: events_park_confirm_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParkEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParkEventRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkEvent'
          description: ''
  /api/v1/events/park/{id}/dismiss/:
    post:
      operationId: events_park_dismiss_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParkEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParkEventRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkEvent'
          description: ''
  /api/v1/features/:
    get:
      operationId: features_retrieve
      tags:
      - features
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Features'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Liveness: the process is up and serving requests. Does not touch
        dependencies.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/help/articles/:
    get:
      operationId: help_articles_list
      tags:
      - help
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HelpArticle'
          description: ''
  /api/v1/help/articles/{id}/:
    get:
      operationId: help_articles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - help
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpArticle'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/:
    get:
      operationId: notifications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: notifications_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/preferences/:
    get:
      operationId: notifications_preferences_retrieve
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
    patch:
      operationId: notifications_preferences_partial_update
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAll'
          description: ''
  /api/v1/parking/areas/:
    get:
      operationId: parking_areas_list
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: min_lon,min_lat,max_lon,max_lat
      - in: query
        name: city
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: supported_area
        schema:
          type: string
      - in: query
        name: verification_status
        schema:
          type: string
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingAreaListList'
          description: ''
  /api/v1/parking/areas/{id}/:
    get:
      operationId: parking_areas_retrieve
      parameters:
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: latitude
        schema:
          type: number
          format: double
      - in: query
        name: longitude
        schema:
          type: number
          format: double
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingAreaDetailDoc'
          description: ''
  /api/v1/parking/areas/{id}/evidence/:
    get:
      operationId: parking_areas_evidence_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaEvidenceResponse'
          description: ''
  /api/v1/parking/areas/{id}/observations/:
    get:
      operationId: parking_areas_observations_retrieve
      description: Active (unexpired) availability observations. Read-only in Part
        1; reporting writes arrive in Part 2.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationsResponse'
          description: ''
  /api/v1/parking/areas/{id}/rules/:
    get:
      operationId: parking_areas_rules_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaRulesResponse'
          description: ''
  /api/v1/parking/compare/:
    get:
      operationId: parking_compare_retrieve
      parameters:
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: query
        name: ids
        schema:
          type: string
          minLength: 1
        description: Comma-separated parking area ids (2–5).
        required: true
      - in: query
        name: latitude
        schema:
          type: number
          format: double
      - in: query
        name: longitude
        schema:
          type: number
          format: double
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareResponse'
          description: ''
  /api/v1/parking/map-layers/:
    get:
      operationId: parking_map_layers_retrieve
      description: GeoJSON overlays for every parking area in a bounding box, classified
        for the planned stay.
      parameters:
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: min_lon,min_lat,max_lon,max_lat (WGS84)
        required: true
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapLayersResponse'
          description: ''
  /api/v1/parking/options/:
    get:
      operationId: parking_options_retrieve
      description: Ranked, free-first parking options for a destination and planned
        stay.
      parameters:
      - in: query
        name: accessible_only
        schema:
          type: boolean
          default: false
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: destination_latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: destination_longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: free_only
        schema:
          type: boolean
          default: false
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: query
        name: include_paid
        schema:
          type: boolean
          default: false
      - in: query
        name: include_restricted
        schema:
          type: boolean
          default: false
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        description: Driver's current position (used when no destination is given).
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
      - in: query
        name: max_walk_minutes
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 10
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: radius_meters
        schema:
          type: integer
          maximum: 3000
          minimum: 100
          default: 1200
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      - in: query
        name: verified_only
        schema:
          type: boolean
          default: false
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingOptionsResponse'
          description: ''
