openapi: 3.0.3
info:
  title: Zpot API
  version: 1.0.0-part1
  description: Parking discovery and mobility intelligence for Lisbon. Free-first,
    evidence-based parking guidance. Development data is sample data, not live regulations.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: 'Authenticated: resend to the signed-in user''s address.'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/cities/:
    get:
      operationId: cities_list
      tags:
      - cities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/v1/cities/{id}/:
    get:
      operationId: cities_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: ''
  /api/v1/cities/{id}/coverage/:
    get:
      operationId: cities_coverage_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportedArea'
          description: ''
  /api/v1/config/:
    get:
      operationId: config_retrieve
      description: Public, non-secret client configuration.
      tags:
      - config
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
          description: ''
  /api/v1/features/:
    get:
      operationId: features_retrieve
      tags:
      - features
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Features'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Liveness: the process is up and serving requests. Does not touch
        dependencies.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/parking/areas/:
    get:
      operationId: parking_areas_list
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: min_lon,min_lat,max_lon,max_lat
      - in: query
        name: city
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: supported_area
        schema:
          type: string
      - in: query
        name: verification_status
        schema:
          type: string
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingAreaListList'
          description: ''
  /api/v1/parking/areas/{id}/:
    get:
      operationId: parking_areas_retrieve
      parameters:
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: latitude
        schema:
          type: number
          format: double
      - in: query
        name: longitude
        schema:
          type: number
          format: double
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingAreaDetailDoc'
          description: ''
  /api/v1/parking/areas/{id}/evidence/:
    get:
      operationId: parking_areas_evidence_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaEvidenceResponse'
          description: ''
  /api/v1/parking/areas/{id}/observations/:
    get:
      operationId: parking_areas_observations_retrieve
      description: Active (unexpired) availability observations. Read-only in Part
        1; reporting writes arrive in Part 2.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationsResponse'
          description: ''
  /api/v1/parking/areas/{id}/rules/:
    get:
      operationId: parking_areas_rules_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaRulesResponse'
          description: ''
  /api/v1/parking/compare/:
    get:
      operationId: parking_compare_retrieve
      parameters:
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: query
        name: ids
        schema:
          type: string
          minLength: 1
        description: Comma-separated parking area ids (2–5).
        required: true
      - in: query
        name: latitude
        schema:
          type: number
          format: double
      - in: query
        name: longitude
        schema:
          type: number
          format: double
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareResponse'
          description: ''
  /api/v1/parking/map-layers/:
    get:
      operationId: parking_map_layers_retrieve
      description: GeoJSON overlays for every parking area in a bounding box, classified
        for the planned stay.
      parameters:
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: bbox
        schema:
          type: string
          minLength: 1
        description: min_lon,min_lat,max_lon,max_lat (WGS84)
        required: true
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapLayersResponse'
          description: ''
  /api/v1/parking/options/:
    get:
      operationId: parking_options_retrieve
      description: Ranked, free-first parking options for a destination and planned
        stay.
      parameters:
      - in: query
        name: accessible_only
        schema:
          type: boolean
          default: false
      - in: query
        name: arrival_at
        schema:
          type: string
          format: date-time
        description: ISO 8601. Naive values are city-local time.
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: destination_latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: destination_longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 1440
          minimum: 15
          default: 120
      - in: query
        name: free_only
        schema:
          type: boolean
          default: false
      - in: query
        name: has_disabled_badge
        schema:
          type: boolean
          default: false
      - in: query
        name: include_paid
        schema:
          type: boolean
          default: false
      - in: query
        name: include_restricted
        schema:
          type: boolean
          default: false
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        description: Driver's current position (used when no destination is given).
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
      - in: query
        name: max_walk_minutes
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 10
      - in: query
        name: permit_type
        schema:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      - in: query
        name: radius_meters
        schema:
          type: integer
          maximum: 3000
          minimum: 100
          default: 1200
      - in: query
        name: vehicle_class
        schema:
          enum:
          - car
          - motorcycle
          - van
          - ev
          type: string
          default: car
          minLength: 1
        description: |-
          * `car` - car
          * `motorcycle` - motorcycle
          * `van` - van
          * `ev` - ev
      - in: query
        name: verified_only
        schema:
          type: boolean
          default: false
      tags:
      - parking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingOptionsResponse'
          description: ''
  /api/v1/places/autocomplete/:
    get:
      operationId: places_autocomplete_list
      parameters:
      - in: query
        name: city
        schema:
          type: string
          minLength: 1
          default: lisbon
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 8
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 120
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceResult'
          description: ''
  /api/v1/places/geocode/:
    get:
      operationId: places_geocode_retrieve
      parameters:
      - in: query
        name: city
        schema:
          type: string
          minLength: 1
          default: lisbon
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 200
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResult'
          description: ''
  /api/v1/places/reverse-geocode/:
    get:
      operationId: places_reverse_geocode_retrieve
      parameters:
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResult'
          description: ''
  /api/v1/ready/:
    get:
      operationId: ready_retrieve
      description: 'Readiness: database reachable, PostGIS installed, migrations applied,
        cache reachable.'
      tags:
      - ready
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: ''
  /api/v1/regulations/:
    get:
      operationId: regulations_list
      description: Permission/charging rules (free, paid, permit-only, badge-only,
        max-stay).
      parameters:
      - in: query
        name: area
        schema:
          type: number
      - in: query
        name: city
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - regulations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingRuleList'
          description: ''
  /api/v1/regulations/{id}/:
    get:
      operationId: regulations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - regulations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingRule'
          description: ''
  /api/v1/regulations/closures/:
    get:
      operationId: regulations_closures_list
      description: Current and upcoming temporary closures (past ones excluded unless
        include_past=true).
      parameters:
      - in: query
        name: active_at
        schema:
          type: string
          format: date-time
      - in: query
        name: area
        schema:
          type: number
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: include_past
        schema:
          type: boolean
      tags:
      - regulations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemporaryClosure'
          description: ''
  /api/v1/regulations/evaluate/:
    post:
      operationId: regulations_evaluate_create
      tags:
      - regulations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
  /api/v1/spots/nearby/:
    get:
      operationId: spots_nearby_retrieve
      description: |-
        TRD compatibility adapter (`/spots/nearby`). Delegates to the canonical search service —
        results follow Zpot's free-first ranking, not raw distance. Prefer /parking/options/.
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
      - in: query
        name: lng
        schema:
          type: number
          format: double
      - in: query
        name: radius
        schema:
          type: integer
      tags:
      - spots
      security:
      - jwtAuth: []
      - {}
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotsNearbyResponse'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_me_partial_update
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: users_me_destroy
