# E2E-007 Details → save → Saved tab → open → remove → empty state
appId: pt.zpot.app
env: { AREA: "1" }
---
- runFlow: _common/signin.yaml
- runFlow: _common/open-area.yaml
- tapOn: { id: "details-save" }
- assertVisible: { text: "Saved" }
- tapOn: { id: "details-back" }
- tapOn: { id: "tab-saved" }
- extendedWaitUntil: { visible: { id: "saved-1" }, timeout: 10000 }
- takeScreenshot: e2e007-saved
- tapOn: { id: "saved-check-1" }
- assertVisible: { id: "details-name" }
- tapOn: { id: "details-back" }
- tapOn: { id: "saved-remove-1" }
- tapOn: { id: "remove-dialog-confirm" }
- extendedWaitUntil: { visible: { id: "saved-empty" }, timeout: 10000 }
- takeScreenshot: e2e007-removed
