# E2E-008 Reminder (dispatched by Celery beat) → notifications → open → active session → read
appId: pt.zpot.app
env: { AREA: "18" }   # Rua do Açúcar: free, no time-window restrictions (clock-independent)
---
- runFlow: _common/signin.yaml
- runFlow: _common/open-area.yaml
- tapOn: { id: "details-parked" }
- extendedWaitUntil: { visible: { id: "start-session-area" }, timeout: 15000 }
- repeat:
    times: 7
    commands: [ { tapOn: { id: "start-session-duration-minus" } } ]
- tapOn: { id: "reminder-15" }
- tapOn: { id: "start-session-submit" }
- runFlow: _common/primer.yaml
- extendedWaitUntil: { visible: { id: "session-timer" }, timeout: 15000 }
- tapOn: { id: "header-back" }
- tapOn: { id: "details-back", optional: true }     # session was opened from parking details
- tapOn: { id: "tab-explore", optional: true }
- tapOn: { id: "explore-bell" }
- extendedWaitUntil: { visible: { id: "notif-session_reminder" }, timeout: 120000 }
- takeScreenshot: e2e008-inbox
- tapOn: { id: "notif-session_reminder" }
- extendedWaitUntil: { visible: { id: "session-timer" }, timeout: 10000 }
- tapOn: { id: "header-back" }
- assertNotVisible: { id: "notif-unread-session_reminder" }   # the opened reminder is now read (other alerts may be unread)
- tapOn: { id: "notif-session_reminder" }
- tapOn: { id: "session-end" }
- tapOn: { id: "end-session-confirm" }
- extendedWaitUntil: { visible: { id: "session-summary-screen" }, timeout: 15000 }
