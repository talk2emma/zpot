# Fresh install → English → manual location → continue as guest → Explore
appId: pt.zpot.app
---
- launchApp:
    clearState: true
- tapOn:                           # Android 17 debug builds only: React Native's dev manifest requests local-network
    text: "Allow"                  # access (Metro). Release builds don't declare ACCESS_LOCAL_NETWORK.
    optional: true
- extendedWaitUntil: { visible: { id: "language-screen" }, timeout: 20000 }
- tapOn: { id: "lang-en" }
- waitForAnimationToEnd
- tapOn: { id: "language-continue", retryTapIfNoChange: true }
- extendedWaitUntil: { visible: { id: "welcome-find" }, timeout: 10000 }
- tapOn: { id: "welcome-find" }
- tapOn: { id: "location-manual" }
- tapOn: { id: "continue-as-guest" }
- extendedWaitUntil: { visible: { id: "explore-screen" }, timeout: 10000 }
