# Primary Part 1 journey (real API, no mocks):
# Launch → Continue as guest → Search destination → Set time/duration → API results → legal free parking → details → Navigate
# Run: maestro test mobile/e2e/part1-core-journey.yaml   (API running + seeded; app installed on a booted simulator/emulator)
appId: pt.zpot.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: "language-screen" }
    timeout: 15000
- tapOn: { id: "lang-en" }
- takeScreenshot: 02-language
- tapOn: { id: "language-continue" }
- tapOn: { id: "welcome-find" }
- tapOn: { id: "location-manual" }          # declining location must not block
- tapOn: { id: "continue-as-guest" }
- assertVisible: { id: "explore-screen" }
- waitForAnimationToEnd
- takeScreenshot: 03-explore-empty
- tapOn: { id: "explore-search" }
- inputText: "Saldanha"
- extendedWaitUntil:
    visible: { id: "suggestion-saldanha" }
    timeout: 10000
- takeScreenshot: 04-search
- tapOn: { id: "suggestion-saldanha" }
- tapOn: { id: "chip-plan" }
- tapOn: { id: "plan-day-tomorrow" }
- tapOn: { id: "plan-hour-plus" }
- tapOn: { id: "plan-duration-plus" }
- takeScreenshot: 05-plan
- tapOn: { id: "plan-apply" }
- extendedWaitUntil:
    visible: { id: "results-count" }
    timeout: 15000
- assertVisible:
    text: "Recommended.*Free.*"
- takeScreenshot: 06-results
- tapOn:                                    # the recommended card is first and always legal free parking
    text: "Recommended.*"
- assertVisible: { id: "details-name" }
- assertVisible: "Check street signs before parking.*"
- takeScreenshot: 07-details
- tapOn: { id: "details-navigate" }
- assertVisible: { id: "nav-picker-screen" }
- takeScreenshot: 08-navigate
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: { id: "nav-app-apple" }        # real hand-off to Apple Maps
      - waitForAnimationToEnd
      - launchApp:                            # come back to Zpot (no state reset)
          clearState: false
          stopApp: false
      - extendedWaitUntil:
          visible: { id: "nav-return-screen" }
          timeout: 10000
      - takeScreenshot: 09-welcome-back
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: { id: "nav-app-google" }
      - waitForAnimationToEnd
      - launchApp:
          clearState: false
          stopApp: false
      - extendedWaitUntil:
          visible: { id: "nav-return-screen" }
          timeout: 10000
      - takeScreenshot: 09-welcome-back
